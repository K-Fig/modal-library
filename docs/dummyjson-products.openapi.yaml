openapi: 3.1.0
info:
  title: DummyJSON Products API
  version: 1.0.0
  description: |
    OpenAPI specification for the product endpoints documented at
    https://dummyjson.com/docs/products.

    Product creation, updates, and deletion are simulated and do not persist
    changes on the server.
servers:
  - url: https://dummyjson.com
    description: DummyJSON public API
tags:
  - name: Products
    description: Sample e-commerce product data.
paths:
  /products:
    get:
      tags: [Products]
      summary: Get all products
      description: Returns 30 products by default.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ModifiedAfter'
        - $ref: '#/components/parameters/ModifiedBefore'
      responses:
        '200':
          description: A paginated product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
  /products/add:
    post:
      tags: [Products]
      summary: Add a product
      description: Simulates creating a product and returns it with a new ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: The simulated created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/search:
    get:
      tags: [Products]
      summary: Search products
      parameters:
        - name: q
          in: query
          required: true
          description: Search term.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ModifiedAfter'
        - $ref: '#/components/parameters/ModifiedBefore'
      responses:
        '200':
          description: A paginated product collection matching the search term.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
  /products/categories:
    get:
      tags: [Products]
      summary: Get all product categories
      responses:
        '200':
          description: Available product categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /products/category-list:
    get:
      tags: [Products]
      summary: Get product category slugs
      responses:
        '200':
          description: Available product category slugs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /products/category/{category}:
    get:
      tags: [Products]
      summary: Get products by category
      parameters:
        - name: category
          in: path
          required: true
          description: Product category slug.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ModifiedAfter'
        - $ref: '#/components/parameters/ModifiedBefore'
      responses:
        '200':
          description: A paginated product collection in the requested category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
  /products/{id}:
    get:
      tags: [Products]
      summary: Get a single product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      tags: [Products]
      summary: Update a product
      description: Simulates replacing or updating a product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: The simulated updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    patch:
      tags: [Products]
      summary: Partially update a product
      description: Simulates partially updating a product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: The simulated updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      tags: [Products]
      summary: Delete a product
      description: Simulates deleting a product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The simulated deleted product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedProduct'
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product ID.
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      description: Maximum number of products to return. Use 0 to return all products.
      schema:
        type: integer
        minimum: 0
        default: 30
    Skip:
      name: skip
      in: query
      description: Number of products to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    Select:
      name: select
      in: query
      description: Comma-separated product fields to include.
      schema:
        type: string
        example: title,price
    SortBy:
      name: sortBy
      in: query
      description: Product field by which to sort.
      schema:
        type: string
        example: title
    Order:
      name: order
      in: query
      description: Sort direction. Requires `sortBy`.
      schema:
        type: string
        enum: [asc, desc]
    ModifiedAfter:
      name: modifiedAfter
      in: query
      description: Only include products updated after this ISO 8601 timestamp.
      schema:
        type: string
        format: date-time
    ModifiedBefore:
      name: modifiedBefore
      in: query
      description: Only include products updated before this ISO 8601 timestamp.
      schema:
        type: string
        format: date-time
  schemas:
    ProductList:
      type: object
      required: [products, total, skip, limit]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          description: Total matching products before pagination.
        skip:
          type: integer
        limit:
          type: integer
    Product:
      type: object
      required:
        - id
        - title
        - description
        - category
        - price
        - discountPercentage
        - rating
        - stock
        - tags
        - sku
        - weight
        - dimensions
        - warrantyInformation
        - shippingInformation
        - availabilityStatus
        - reviews
        - returnPolicy
        - minimumOrderQuantity
        - meta
        - thumbnail
        - images
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        discountPercentage:
          type: number
        rating:
          type: number
        stock:
          type: integer
        tags:
          type: array
          items:
            type: string
        brand:
          type: string
        sku:
          type: string
        weight:
          type: integer
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        warrantyInformation:
          type: string
        shippingInformation:
          type: string
        availabilityStatus:
          type: string
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        returnPolicy:
          type: string
        minimumOrderQuantity:
          type: integer
        meta:
          $ref: '#/components/schemas/ProductMeta'
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
    ProductInput:
      type: object
      description: Product fields accepted by the simulated create and update endpoints.
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        discountPercentage:
          type: number
        rating:
          type: number
        stock:
          type: integer
        tags:
          type: array
          items:
            type: string
        brand:
          type: string
        sku:
          type: string
        weight:
          type: integer
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        warrantyInformation:
          type: string
        shippingInformation:
          type: string
        availabilityStatus:
          type: string
        returnPolicy:
          type: string
        minimumOrderQuantity:
          type: integer
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
    DeletedProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [isDeleted, deletedOn]
          properties:
            isDeleted:
              type: boolean
              const: true
            deletedOn:
              type: string
              format: date-time
    Dimensions:
      type: object
      required: [width, height, depth]
      properties:
        width:
          type: number
        height:
          type: number
        depth:
          type: number
    Review:
      type: object
      required: [rating, comment, date, reviewerName, reviewerEmail]
      properties:
        rating:
          type: integer
        comment:
          type: string
        date:
          type: string
          format: date-time
        reviewerName:
          type: string
        reviewerEmail:
          type: string
          format: email
    ProductMeta:
      type: object
      required: [createdAt, updatedAt, barcode, qrCode]
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        barcode:
          type: string
        qrCode:
          type: string
          format: uri
    Category:
      type: object
      required: [slug, name, url]
      properties:
        slug:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
